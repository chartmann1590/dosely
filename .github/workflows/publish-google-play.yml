name: Publish to Google Play

# Builds a signed release AAB with the keystore and Play service account held in
# the repo's GitHub secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD,
# KEY_ALIAS, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, ADMOB_*), then uploads it to the
# chosen Play track. Manual trigger only, so nothing publishes by accident.
#   status "draft"     -> stages the release; review it and send for review in Play Console
#   status "completed" -> rolls the release out (Play still reviews it first)
# version_code (phone) and wear_version_code (Wear OS, uploaded to the wear:<track>
# form-factor track) must each be unique and higher than every code already on Play
# (App bundle explorer); Play refuses a reused code ("Version code N has already
# been used"), so a re-run with the same number cannot double-upload. Leave one
# blank to skip that bundle.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Target track"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options: [draft, completed, inProgress]
      version_code:
        description: "Phone app versionCode — higher than every code already on Play (App bundle explorer; a reused code is refused by Play). Leave blank to skip the phone bundle."
        required: false
        type: string
      wear_version_code:
        description: "Wear OS app versionCode (unique, above every code on Play; uploads to the wear:<track> form-factor track). Leave blank to skip the Wear bundle."
        required: false
        type: string
      version_name:
        description: "versionName"
        required: true
        default: "1.1.1"
        type: string
      release_notes:
        description: "en-US release notes"
        required: false
        default: "Bug fixes and improvements."
        type: string
      dry_run:
        description: "Build, sign and verify only — do not upload to Play"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Build & upload signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is missing"; exit 1; fi
          done
          # Secrets pasted from files can carry a UTF-8 BOM, CR/LF or other invisible
          # characters (this repo's did, Oct 2026). Keep only what the values can contain.
          ascii() { printf '%s' "$1" | tr -cd '\40-\176'; }
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
          STORE_PW="$(ascii "$KEYSTORE_PASSWORD")"; KEY_PW="$(ascii "$KEY_PASSWORD")"; ALIAS="$(ascii "$KEY_ALIAS")"
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
          echo "keystore: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The decoded keystore does not open with KEYSTORE_PASSWORD / KEY_ALIAS — check the repo secrets"; exit 1
          fi
          echo "keystore opens and alias is present"
          { echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"; echo "KEYSTORE_PASSWORD=$STORE_PW"; echo "KEY_PASSWORD=$KEY_PW"; echo "KEY_ALIAS=$ALIAS"; } >> "$GITHUB_ENV"

      - name: Check inputs
        run: |
          if [ -z "${{ github.event.inputs.version_code }}" ] && [ -z "${{ github.event.inputs.wear_version_code }}" ]; then
            echo "::error::Give a version_code (phone) and/or a wear_version_code (Wear OS)"; exit 1
          fi

      - name: Build signed phone AAB
        if: ${{ github.event.inputs.version_code != '' }}
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
        run: |
          echo "Building phone versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew :app:bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | head -3

      - name: Build signed Wear OS AAB
        if: ${{ github.event.inputs.wear_version_code != '' }}
        env:
          VERSION_CODE: ${{ github.event.inputs.wear_version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          echo "Building wear versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew :wear:bundleRelease --no-daemon
          jarsigner -verify wear/build/outputs/bundle/release/wear-release.aab | head -3

      - name: Prepare release notes
        run: |
          mkdir -p distribution/whatsnew
          printf '%s\n' "${{ github.event.inputs.release_notes }}" > distribution/whatsnew/whatsnew-en-US

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dosely-release-aab-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      - name: Upload phone AAB to Google Play
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.version_code != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.dosely
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          releaseName: ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})
          whatsNewDirectory: distribution/whatsnew

      - name: Upload Wear OS AAB to Google Play
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.wear_version_code != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.dosely
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          track: wear:${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          releaseName: ${{ github.event.inputs.version_name }} (${{ github.event.inputs.wear_version_code }})
          whatsNewDirectory: distribution/whatsnew
