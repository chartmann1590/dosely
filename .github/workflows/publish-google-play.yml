name: Publish to Google Play

# Builds a signed release AAB (keystore + Play service account from repo secrets)
# and uploads it to the chosen Play track. Status "draft" stages the release so
# it can be reviewed and sent for review in Play Console; "completed" rolls out.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Target track"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options: [draft, completed, inProgress]
      version_code:
        description: "versionCode (must be higher than every code already on Play)"
        required: true
        type: string
      version_name:
        description: "versionName"
        required: true
        default: "1.1.1"
        type: string
      release_notes:
        description: "en-US release notes"
        required: false
        default: "Bug fixes and improvements."
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build & upload signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          # The secret may carry line breaks / CRs (base64 -d is strict): strip
          # whitespace, ignore stray characters, then make sure it opens as a keystore.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d -i > "$RUNNER_TEMP/release.jks"
          echo "decoded $(stat -c %s "$RUNNER_TEMP/release.jks") bytes; magic: $(head -c 4 "$RUNNER_TEMP/release.jks" | xxd -p)"
          echo "base64 secret: chars ${#KEYSTORE_BASE64}, bytes $(printf '%s' "$KEYSTORE_BASE64" | wc -c), non-base64 bytes: $(printf '%s' "$KEYSTORE_BASE64" | tr -d 'A-Za-z0-9+/=' | wc -c) (hex of those: $(printf '%s' "$KEYSTORE_BASE64" | tr -d 'A-Za-z0-9+/=' | xxd -p | head -c 40))"
          # Secrets pasted from files can carry invisible characters: try as stored, trimmed, and printable-ASCII only.
          trim() { printf '%s' "$1" | tr -d '\r\n\t'; }
          ascii() { printf '%s' "$1" | tr -cd '\40-\176'; }
          open_with() { keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$1" > /dev/null 2>&1 && echo yes || echo no; }
          SP_T="$(trim "$KEYSTORE_PASSWORD")"; KP_T="$(trim "$KEY_PASSWORD")"; SP_A="$(ascii "$KEYSTORE_PASSWORD")"; KP_A="$(ascii "$KEY_PASSWORD")"
          echo "store pw: chars ${#KEYSTORE_PASSWORD}, bytes $(printf '%s' "$KEYSTORE_PASSWORD" | wc -c), printable-ascii bytes ${#SP_A}; key pw: chars ${#KEY_PASSWORD}, bytes $(printf '%s' "$KEY_PASSWORD" | wc -c), printable-ascii bytes ${#KP_A}; same value: $([ "$KEYSTORE_PASSWORD" = "$KEY_PASSWORD" ] && echo yes || echo no)"
          echo "alias: chars ${#KEY_ALIAS}, bytes $(printf '%s' "$KEY_ALIAS" | wc -c)"
          echo "opens: store-raw=$(open_with "$KEYSTORE_PASSWORD") store-trim=$(open_with "$SP_T") store-ascii=$(open_with "$SP_A") key-raw=$(open_with "$KEY_PASSWORD") key-trim=$(open_with "$KP_T") key-ascii=$(open_with "$KP_A") empty=$(open_with "")"
          echo "keytool (java17) error: $(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP_A" 2>&1 | grep -i 'error\|exception' | head -1)"
          echo "openssl view of the PKCS12 (structure only): $(openssl pkcs12 -in "$RUNNER_TEMP/release.jks" -info -noout -passin pass:"$SP_A" 2>&1 | grep -v '^$' | head -3 | tr '\n' ' | ')"
          STORE_PW=""
          for cand in "$SP_A" "$KP_A" "$SP_T" "$KP_T" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD"; do if [ -n "$cand" ] && [ "$(open_with "$cand")" = yes ]; then STORE_PW="$cand"; break; fi; done
          if [ -z "$STORE_PW" ]; then echo "::error::Keystore does not open with KEYSTORE_PASSWORD or KEY_PASSWORD (raw, trimmed, or ASCII-only)"; exit 1; fi
          echo "::add-mask::$STORE_PW"
          ALIAS_T="$(ascii "$KEY_ALIAS")"; KP_USE="$KP_A"
          echo "alias present in keystore: $(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" -alias "$ALIAS_T" > /dev/null 2>&1 && echo yes || echo no)"
          echo "keystore opens OK"
          { echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"; echo "KEYSTORE_PASSWORD=$STORE_PW"; echo "KEY_PASSWORD=$KP_USE"; echo "KEY_ALIAS=$ALIAS_T"; } >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
        run: |
          echo "Building versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify the AAB is signed with the release key
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          jarsigner -verify "$AAB" | head -5

      - name: Prepare release notes
        run: |
          mkdir -p distribution/whatsnew
          printf '%s\n' "${{ github.event.inputs.release_notes }}" > distribution/whatsnew/whatsnew-en-US

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosely-release-aab-${{ github.event.inputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.dosely
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          releaseName: ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true
