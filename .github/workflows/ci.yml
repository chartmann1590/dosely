name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (also compiles the cross-promo SDK)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests (app + SDK)
        run: ./gradlew :app:testDebugUnitTest :hartmann-crosspromo:testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dosely-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Typecheck
        working-directory: backend
        run: npm ci && npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

  release-check:
    # Manual verification that the AdMob secret plumbing works end to end.
    # The AAB is unsigned (no signing config in CI) — upload artifact only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release AAB with production ad IDs from secrets
        env:
          ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: dosely-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
