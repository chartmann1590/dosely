name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Target track (internal, alpha, beta, production)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (completed, draft, inProgress)"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress
      release_notes:
        description: "en-US release notes text"
        required: false
        default: "Initial release of Dosely — GLP-1 medication tracking, smart dose scheduling, supply inventory, and offline AI coach."
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found; AAB may be built unsigned or with debug key."
          fi

      - name: Compute version code and name
        id: version
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building Version Code: $VERSION_CODE, Version Name: $VERSION_NAME"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :hartmann-crosspromo:testDebugUnitTest --no-daemon

      - name: Build signed release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Prepare release notes
        run: |
          mkdir -p distribution/whatsnew
          printf '%s\n' "${{ github.event.inputs.release_notes }}" > distribution/whatsnew/whatsnew-en-US

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosely-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Verify service account key
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing. Add it to GitHub repository secrets to upload directly to Google Play."
            exit 1
          fi
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.dosely
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          whatsNewDirectory: distribution/whatsnew
